name: gate

on:
  merge_group:
    # ADR-0042：merge queue 必需订阅
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    # CI-4（enforced）：zizmor 工作流安全审计 + 大文件/密钥样文件巡检——可复用
    # 工作流统一实现（accounts.yaml 仅 secret_ref 引用，无明文凭据面）
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@61191f87c537f6e887695517121c6e530a838261 # v1

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # zizmor artipacked：不持久化凭据
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: py_compile
        run: python -m py_compile cnb_pool.py
      - name: unittest
        run: python -m unittest discover -s tests -v

  gate:
    # 严格聚合器（ADR-0032：skipped≠success）——产出 ruleset required check
    # "gate" 上下文（此前唯一 job 名为 selftest，required check 永不满足）
    if: always()
    needs: [selftest, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          OK=$(echo "$NEEDS" | jq -r 'to_entries | all(.value.result == "success")')
          if [[ "$OK" != "true" ]]; then
            echo "::error::gate 上游未全绿（skipped≠success：严格断言——ADR-0032）"; exit 1
          fi
